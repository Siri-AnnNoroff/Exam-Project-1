<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <script
      src="https://kit.fontawesome.com/10e9cc59c4.js"
      crossorigin="anonymous"
    ></script>
    <title>Register | Online shop</title>
    <meta name="description" content="Register a new account at Online shop" />
  </head>
  <body>
    <header>
      <h1 class="logo"><a href="../index.html"> Online shop</a></h1>

      <div class="icons">
        <a href="/account/login.html" aria-label="Account">
          <i class="fa-regular fa-user"></i>
        </a>

        <a href="../cart/index.html" class="cart" aria-label="Cart">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-badge">0</span>
        </a>
      </div>
    </header>
    <main>
      <h2>Register new account</h2>
      <form id="registration-form">
        <label for="name">Name:</label>
        <input type="text" id="name" autocomplete="name" name="name" required />
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          autocomplete="email"
          name="email"
          placeholder="youremail@example.com"
          required
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          autocomplete="new-password"
          name="password"
          required
        />
        <label for="password">Confirm password</label>
        <input
          type="password"
          id="confirm-password"
          autocomplete="new-password"
          name="confirmPassword"
          required
        />
        <p id="form-message" role="alert" aria-live="polite"></p>

        <button type="submit" class="carousel-cta">Register user</button>
      </form>
    </main>
    <footer>
      <a href="../pages/ordering.html">Ordering</a>
      <a href="../pages/returns.html">Returns</a>
      <a href="../account/register.html">Register</a>
      <a href="../pages/privacy-policy.html">Privacy policy</a>
      <a href="../pages/terms.html">Terms and conditions</a>
      <a href="../pages/cookie-policy.html">Cookie policy</a>
    </footer>
    <script type="module" src="../js/register.js"></script>
  </body>
</html>
