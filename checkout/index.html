<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <script
      src="https://kit.fontawesome.com/10e9cc59c4.js"
      crossorigin="anonymous"
    ></script>
    <title>Checkout | Online shop</title>
    <meta name="description" content="Complete your purchase at Online shop" />
  </head>
  <body>
    <header>
      <h1 class="logo"><a href="../index.html"> Online shop</a></h1>

      <div class="icons">
        <a href="/account/login.html" aria-label="Account">
          <i class="fa-regular fa-user"></i>
        </a>

        <a href="../cart/index.html" class="cart" aria-label="Cart">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-badge">0</span>
        </a>
      </div>
    </header>
    <main>
      <h2>Checkout</h2>
      <h3>Shipping information</h3>
      <form class="checkout-form">
          <label for="fname"></i>Name</label>
            <input type="text" id="fname" name="firstname" placeholder="P. Sherman">
          <label for="adr"> Address</label>
            <input type="text" id="adr" name="address" placeholder="42 Wallaby Way">
          <label for="zip">Zip code</label>
            <input type="text" id="zip" name="zip" placeholder="2003">
          <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="Sydney">
          <label for="country">Country</label>
            <input type="text" id="country" name="couuntry" placeholder="Australia">
      <h3>Payment options</h3>
      <div class="payment-options">
        <input type="radio" id="pay1" name="payment">
          <label for="pay1">Paypal</label>
        <input type="radio" id="pay2" name="payment">
          <label for="pay2">Gpay</label>
        <input type="radio" id="pay3" name="payment">
          <label for="pay3">Apple pay</label>
          </div>
            <button type="submit" value="Submit" class="carousel-cta">Complete purchase</button>
      </form>
    </main>
    <footer>
      <a href="../pages/ordering.html">Ordering</a>
      <a href="../pages/returns.html">Returns</a>
      <a href="../account/register.html">Register</a>
      <a href="../pages/privacy-policy.html">Privacy policy</a>
      <a href="../pages/terms.html">Terms and conditions</a>
      <a href="../pages/cookie-policy.html">Cookie policy</a>
    </footer>
  </body>
</html>
